<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Katherine Elizabeth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Katherine Elizabeth (Ellie): film, photography, graphic design and fine art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a wide, expanded grotesk wordmark fitted edge to edge; images on a 12-column grid placed in
   staggered rows with generous gaps; ivory by default, near-black for Film, cool rose for Graphic Design, white for Art. */
:root{
  --ivory:#F8F4EE; --white:#FFFFFF; --ink:#171513; --ink-soft:#5E5850; --rose:#EACBD3; --mauve:#C99DAD; --film:#0A0A0B; --film-ink:#F4F2EE; --film-soft:#A7A39C;
  --petal:#F4DCE3; --orchid:#B3265F; --plum:#43102F; --lilac:#D9C3DD; --stamen:#E4B75A; --accent:var(--orchid);
  --bg:var(--ivory); --fg:var(--ink); --soft:var(--ink-soft); --line:rgba(23,21,19,.16); --ph:#DAD3C8; --ph-ink:#4D4740;
  --display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --body:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --gut:clamp(16px,3.2vw,48px); --maxw:1520px; --ease:cubic-bezier(.22,.7,.2,1);
  color-scheme:light;
}
body[data-page="film"]{--bg:var(--film);--fg:var(--film-ink);--soft:var(--film-soft);--line:rgba(244,242,238,.2);--ph:#1C1C1E;--ph-ink:#9B978F;color-scheme:dark}
body[data-page="design"]{--bg:var(--rose);--soft:#6A5459;--line:rgba(23,21,19,.2);--ph:#F2E7E6}
body[data-page="art"]{--bg:var(--white);--ph:#EEE9E1}
body[data-page="resume"]{--bg:#ECE7DE}
body[data-page="film"]{--accent:#EE8DB4}
body[data-page="design"]{--accent:var(--plum)}
body[data-page="photo"]{--bg:#E6E9ED;--fg:#15181C;--soft:#5A6068;--line:rgba(24,28,34,.16);--ph:#D1D6DC;--ph-ink:#4B515A}
body[data-page="about"]{--bg:#F7ECEF;--soft:#6B5A60;--ph:#E4D3D8}
body[data-page="contact"]{--bg:var(--petal);--soft:#6B5A60;--line:rgba(23,21,19,.18)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1rem/1.62 var(--body);-webkit-font-smoothing:antialiased;transition:background-color .45s var(--ease),color .45s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
img{display:block;max-width:100%}
h1,h2,h3,p,ul,ol,dl,dd,figure{margin:0;padding:0}
ul,ol{list-style:none}
:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.skip{position:absolute;left:-9999px;top:8px}
.skip:focus{left:16px;z-index:300;background:var(--fg);color:var(--bg);padding:10px 14px}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.sec{padding-block:clamp(56px,9vw,150px)}
.grid12{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut)}

/* type */
.wm{display:block;margin:0;font-family:var(--display);font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:-.02em;line-height:.88;padding-top:.06em}
.wm-l{display:block;width:max-content;white-space:nowrap}
.h2{font:700 clamp(1.7rem,3.4vw,3.3rem)/1 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:-.018em;text-wrap:balance}
.h3{font:600 1.15rem/1.25 var(--body)}
.eyebrow,.sl,.cap,.lnk,.chip,.btn,.btn-w,.subnav a,.subnav button,.nav a{font-family:var(--body);font-weight:500;font-size:.72rem;line-height:1.3;letter-spacing:.15em;text-transform:uppercase}
.eyebrow{color:var(--soft)}
.lede{font:400 clamp(1.15rem,1.8vw,1.6rem)/1.38 var(--body);max-width:34ch;text-wrap:pretty}
.body{max-width:62ch;text-wrap:pretty}
.todo{color:var(--soft);text-decoration:underline dotted;text-decoration-color:var(--line);text-underline-offset:5px;text-decoration-thickness:1px}
.note{font-size:.78rem;color:var(--soft);max-width:60ch}

/* color accents */
::selection{background:var(--accent);color:#fff}
.nav a::after,.subnav a::after,.subnav button::after{background:var(--accent)}
.lnk{transition:color .3s}
.lnk:hover,.back:hover{color:var(--accent)}
.ix b{transition:color .3s}
.ix a:hover b{color:var(--accent)}
.ent-h:hover .org{color:var(--accent)}
.chip[aria-pressed="true"]{border-bottom-color:var(--accent)}

/* home */
.band{background:var(--bg);color:var(--fg)}
.hero{min-height:calc(100vh - 70px);min-height:calc(100svh - 70px);display:flex;flex-direction:column;justify-content:space-between;gap:clamp(120px,16vw,260px);padding-top:clamp(72px,13vw,220px);padding-bottom:clamp(40px,6vw,88px)}
.hero .wm{width:min(100%,64vw)}
@media(max-width:760px){.hero .wm{width:100%}}
.hero-bot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px 48px}
.hero-nav{display:flex;flex-wrap:wrap;gap:6px 36px}
.hero-nav a{font:500 .74rem/1.3 var(--body);letter-spacing:.15em;text-transform:uppercase;padding:8px 0;border-bottom:1px solid transparent;transition:border-color .3s,color .3s}
.hero-nav a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.moment{display:block}
.moment-bg{display:grid;place-items:center;background:var(--petal);padding:clamp(48px,11vw,170px) var(--gut)}
.moment-ph{width:clamp(190px,30vw,420px)}
.stag.airy{gap:clamp(80px,22vw,160px)}
@media(min-width:900px){.stag.airy{gap:0;row-gap:clamp(9rem,17vw,21rem)}}
.band-blush{--bg:var(--petal);--fg:var(--ink);--soft:#6A5459;--line:rgba(23,21,19,.18);--accent:var(--orchid)}
.band-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 40px;margin-bottom:clamp(56px,9vw,140px)}
.big{font:800 clamp(2.2rem,6.4vw,5.6rem)/.95 var(--display);font-stretch:122%;text-transform:uppercase;letter-spacing:-.025em;text-wrap:balance}
.rose-in{display:grid;gap:clamp(28px,4vw,56px);align-items:end}
@media(min-width:900px){.rose-in{grid-template-columns:minmax(0,7fr) minmax(0,4fr);column-gap:var(--gut)}}

/* header + nav */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);transition:background-color .45s var(--ease)}
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);transition:background-color .45s var(--ease)}
.hd-in{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-block:18px}
.brand{font:800 .88rem/1 var(--display);font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;white-space:nowrap}
.nav{display:none;gap:clamp(16px,1.9vw,30px);align-items:center}
.nav a{position:relative;padding:8px 0;white-space:nowrap}
.nav a::after,.subnav a::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.nav a:hover::after,.nav a[aria-current="page"]::after,.subnav a:hover::after,.subnav a[aria-current="page"]::after{transform:scaleX(1)}
.menu-btn{font:500 .72rem/1 var(--body);letter-spacing:.15em;text-transform:uppercase;padding:10px 0}
@media(min-width:1320px){.nav{display:flex}.menu-btn{display:none}}
.menu{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--fg);visibility:hidden;opacity:0;transition:opacity .3s var(--ease),visibility 0s .3s;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.menu.open{visibility:visible;opacity:1;transition:opacity .3s var(--ease)}
.menu-top{display:flex;justify-content:space-between;align-items:center;padding-block:18px}
.menu-list{display:grid;gap:4px;padding-block:clamp(24px,6vh,56px)}
.menu-list a{font:800 clamp(1.9rem,8vw,3.6rem)/1.08 var(--display);font-stretch:118%;text-transform:uppercase;letter-spacing:-.02em;display:block;padding:4px 0}
.menu-list a[aria-current="page"]{color:var(--soft)}
.menu-sub{display:flex;flex-wrap:wrap;gap:10px 28px;padding-bottom:40px}
.menu-sub a{font:500 .74rem/1 var(--body);letter-spacing:.15em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:5px}

/* page motion */
main{display:block;position:relative;z-index:1}
main.leaving{opacity:0;transition:opacity .16s ease}
main.entering{animation:rise .5s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.pre{opacity:0;transform:translateY(28px)}

/* links, buttons, chips */
.lnk{display:inline-flex;align-items:center;gap:.8em;border-bottom:1px solid currentColor;padding-bottom:5px;width:max-content;max-width:100%}
.lnk .ar,.arrow{display:inline-block;transition:transform .35s var(--ease)}
.lnk:hover .ar,a:hover>.arrow,.ix a:hover .arrow,.frow:hover .arrow{transform:translateX(6px)}
.btn{display:inline-flex;align-items:center;gap:.8em;background:var(--fg);color:var(--bg);padding:15px 24px;transition:opacity .25s}
.btn:hover{opacity:.82}
.btn-w{display:inline-flex;align-items:center;gap:.8em;background:var(--fg);color:var(--bg);padding:15px 24px;transition:opacity .25s}
.btn-w:hover{opacity:.82}
.chips{display:flex;flex-wrap:wrap;gap:6px 26px}
.chip{padding:8px 0;color:var(--soft);border-bottom:1px solid transparent;transition:color .25s,border-color .25s}
.chip:hover{color:var(--fg)}
.chip[aria-pressed="true"]{color:var(--fg);border-bottom-color:currentColor}
.chip sup{font-size:.7em;margin-left:.3em;letter-spacing:0}
.subnav{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:clamp(20px,3vw,36px)}
.subnav a,.subnav button{position:relative;padding:8px 0;color:var(--soft)}
.subnav [aria-current="page"],.subnav a:hover,.subnav button:hover{color:var(--fg)}
.subnav button::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
.subnav button:hover::after{transform:scaleX(1)}
.back{display:inline-flex;gap:.8em;margin-bottom:clamp(20px,3vw,40px)}
.back .ar{transition:transform .35s var(--ease)}
.back:hover .ar{transform:translateX(-6px)}

/* index lists */
.ix a{display:flex;justify-content:space-between;align-items:baseline;gap:20px;padding:15px 0;border-top:1px solid var(--line);transition:padding-left .4s var(--ease)}
.ix a:last-child{border-bottom:1px solid var(--line)}
.ix a:hover{padding-left:10px}
.ix b{font:700 clamp(1.15rem,1.9vw,1.7rem)/1.1 var(--display);font-stretch:112%;text-transform:uppercase;letter-spacing:-.01em}
.ix small{font-size:.8rem;color:var(--soft);text-align:right}

/* frames, placeholders, figures */
.frame{display:block;position:relative;overflow:hidden;aspect-ratio:var(--r,4/5);width:100%;max-width:100%}
.frame img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.ph{background:var(--phc,var(--ph));color:var(--ph-ink);transition:filter .5s}
.ph::after{content:"";position:absolute;inset:10px;border:1px solid currentColor;opacity:.14;pointer-events:none}
.ph-x{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-50%);opacity:.4}
.ph-label{position:absolute;left:18px;right:18px;bottom:16px;font:500 .64rem/1.35 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.fig{display:block}
.fig-btn{display:block;width:100%;cursor:zoom-in}
.fig-btn:hover img{transform:scale(1.03)}
.fig-btn:hover .ph,.card:hover .ph{filter:brightness(.965)}
.cap{display:flex;justify-content:space-between;gap:1em;margin-top:12px;color:var(--soft);letter-spacing:.12em}
.stag{display:flex;flex-direction:column;gap:clamp(56px,16vw,110px)}
.stag>*{width:var(--mw,100%);align-self:var(--ma,flex-start);min-width:0}
@media(min-width:900px){
  .stag{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);row-gap:clamp(6rem,12vw,13rem)}
  .stag>*{width:auto;grid-row:var(--row);grid-column:var(--col);align-self:var(--al,start)}
}

/* video */
.vid{background:#161617;color:#F4F2EE}
.vid img{position:absolute;inset:0;z-index:1}
.vid-fb{position:absolute;inset:0;z-index:0;display:flex;align-items:flex-end;padding:16px 18px;font:500 .62rem/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#A7A39C}
.vid-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:clamp(46px,6vw,76px);aspect-ratio:1;border:1px solid rgba(255,255,255,.85);border-radius:50%;display:grid;place-items:center;background:rgba(10,10,11,.35);transition:transform .45s var(--ease),background-color .3s}
.vid-play svg{width:34%;height:34%;margin-left:6%;fill:#fff}
a:hover>.vid .vid-play,button:hover>.vid .vid-play,.strip-i:hover .vid-play{transform:translate(-50%,-50%) scale(1.08);background:rgba(10,10,11,.6)}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vid.sm .vid-play{width:24px}
.vid.sm .vid-fb{align-items:flex-start;padding:7px 9px;font-size:.52rem;letter-spacing:.1em}
.vid.sm .fb-more{display:none}

/* home */

/* film */
.filters{display:flex;flex-wrap:wrap;gap:6px 30px;margin-top:clamp(28px,4vw,56px)}
.feat-play{display:block;width:100%}
.feat-meta{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px;margin-top:22px}
.feat-act{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center}
.ftitle{margin-top:10px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--gut);margin-top:clamp(28px,4vw,48px)}
.strip-i{display:block;opacity:.55;transition:opacity .3s}
.strip-i:hover,.strip-i[aria-pressed="true"]{opacity:1}
.strip-i .cap{justify-content:flex-start}
.findex{margin-top:clamp(56px,8vw,120px)}
.frow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 22px;align-items:center;padding:18px 0;border-top:1px solid var(--line)}
.frow:last-child{border-bottom:1px solid var(--line)}
.frow-t b{display:block;font:700 clamp(1.1rem,2vw,1.8rem)/1.1 var(--display);font-stretch:110%;text-transform:uppercase;letter-spacing:-.01em}
.frow-t small{display:block;color:var(--soft);font-size:.82rem;margin-top:4px}
.frow .arrow-t{grid-column:2}
@media(min-width:760px){.frow{grid-template-columns:150px minmax(0,1fr) 120px auto}.frow .arrow-t{grid-column:auto;justify-self:end}}

/* detail pages */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:28px var(--gut)}
.facts dt{font:500 .68rem/1.3 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--soft);margin-bottom:8px}
.facts dd{max-width:36ch}
.sect{display:grid;gap:clamp(18px,3vw,44px);padding-block:clamp(36px,5vw,76px);border-top:1px solid var(--line)}
.sl{color:var(--soft)}
.sc{min-width:0;display:grid;gap:18px;align-content:start}
@media(min-width:900px){.sect{grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut)}.sect>.sl{grid-column:1 / span 3}.sect>.sc{grid-column:4 / span 8}}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:var(--gut);align-items:start}
.credits{width:100%;border-collapse:collapse}
.credits th,.credits td{text-align:left;padding:12px 0;border-top:1px solid var(--line);font-weight:400;vertical-align:top}
.credits th{width:38%;font:500 .72rem/1.5 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--soft);padding-right:16px}
.bul{display:grid;gap:8px}
.bul li{padding-left:1.1em;position:relative}
.bul li::before{content:"";position:absolute;left:0;top:.78em;width:.5em;height:1px;background:currentColor}
.rel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:var(--gut)}
.card{display:block}
.card .h3{margin-top:14px}

/* photography */
.botan{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.catix a{padding:22px 0}
.catix b{font-size:clamp(1.5rem,3.6vw,3.2rem)}
.catix small{max-width:34ch}

/* design */
.dp-t{display:grid;gap:14px}
.dp-t p{max-width:34ch}
.flipper{perspective:1600px;max-width:520px;margin-inline:auto;width:100%}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .85s var(--ease);aspect-ratio:3/4;cursor:pointer}
.flipper[data-side="back"] .flip-in{transform:rotateY(180deg)}
.flip-in>.frame{position:absolute;inset:0;height:100%;aspect-ratio:auto;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-in>.back-f{transform:rotateY(180deg)}
.folded{max-width:340px;margin-inline:auto}
.viewer-ctl{display:flex;flex-wrap:wrap;gap:6px 26px;justify-content:center;margin-top:24px}
.var-stage{max-width:620px;margin-inline:auto;display:grid;place-items:center;aspect-ratio:1/1;background:var(--ph);color:var(--ph-ink);position:relative}
.var-stage svg{width:42%;height:auto;overflow:visible}
.var-stage .ph-label{bottom:16px}
.var-row{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:22px}

/* experience */
.ent{border-top:1px solid var(--line)}
.ent:last-of-type{border-bottom:1px solid var(--line)}
.ent-h{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;padding:clamp(18px,2.6vw,30px) 0}
.ent-h .org{font:700 clamp(1.4rem,3.4vw,3rem)/1 var(--display);font-stretch:114%;text-transform:uppercase;letter-spacing:-.02em;transition:transform .45s var(--ease);text-wrap:balance}
.ent-h:hover .org{transform:translateX(8px)}
.ent-meta{grid-column:1;display:flex;flex-wrap:wrap;gap:4px 22px;color:var(--soft);font-size:.86rem}
.ent-meta .k{font:500 .68rem/1.6 var(--body);letter-spacing:.15em;text-transform:uppercase}
.ent-pm{grid-row:1 / span 2;grid-column:2;width:30px;height:30px;position:relative}
.ent-pm::before,.ent-pm::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:1px;background:currentColor;transform:translate(-50%,-50%);transition:transform .4s var(--ease)}
.ent-pm::after{transform:translate(-50%,-50%) rotate(90deg)}
.ent.open .ent-pm::after{transform:translate(-50%,-50%) rotate(0)}
.ent-p{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.ent.open .ent-p{grid-template-rows:1fr}
.ent-p>div{overflow:hidden}
.ent-body{display:grid;gap:28px var(--gut);padding-bottom:clamp(28px,4vw,52px)}
@media(min-width:900px){.ent-body{grid-template-columns:repeat(12,minmax(0,1fr))}.ent-body>.c1{grid-column:1 / span 5}.ent-body>.c2{grid-column:7 / span 6}}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font:500 .68rem/1 var(--body);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line);padding:8px 11px}
.xpl{display:grid;gap:clamp(24px,4vw,64px);margin-top:clamp(28px,4vw,56px)}
@media(min-width:900px){.xpl{grid-template-columns:230px minmax(0,1fr)}.xpl-f{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}}
.xpl-f .chips{flex-direction:column;gap:2px}
@media(max-width:899px){.xpl-f .chips{flex-direction:row}}

/* resume + education */
.sheet{background:var(--white);color:var(--ink);padding:clamp(24px,5vw,72px);max-width:880px;margin-inline:auto;display:grid;gap:clamp(24px,3vw,38px)}
.sheet h2{font:700 .72rem/1.3 var(--body);letter-spacing:.16em;text-transform:uppercase;border-bottom:1px solid rgba(23,21,19,.2);padding-bottom:8px;margin-bottom:12px}
.sheet .todo{color:#6a645c}

function ph(o,cls=''){

function lay(l,mw){

}

/* ---------- botanical texture (photography) ---------- */
function botanical(){
  const leaf='M0 0C16 -22 16 -58 0 -92C-16 -58 -16 -22 0 0Z';
  const frond=(x,y,rot,s)=>{
    let g=`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><path d="M0 0C14 -130 -8 -270 26 -430" fill="none" stroke-width="3"/>`;
    for(let i=0;i<9;i++){const yy=-36-i*42,xx=Math.sin(i*.55)*9+i*2.8,a=(i%2?1:-1)*(54-i*2.2),sc=1.15-i*.07;g+=`<path d="${leaf}" transform="translate(${xx.toFixed(1)} ${yy}) rotate(${a.toFixed(1)}) scale(${sc.toFixed(2)})"/>`;}
    return g+`<path d="${leaf}" transform="translate(26 -430) rotate(6) scale(.7)"/></g>`;
  };
  const flower=(x,y,s)=>{let g=`<g transform="translate(${x} ${y}) scale(${s})">`;for(let i=0;i<6;i++)g+=`<ellipse cx="0" cy="-34" rx="17" ry="34" transform="rotate(${i*60})"/>`;return g+'<circle r="12"/></g>';};
  const art=`${frond(120,1150,-8,1.15)}${frond(520,1230,14,.9)}${frond(1180,1200,-14,1.2)}${frond(1500,1100,10,.85)}${frond(780,420,176,.8)}${frond(60,330,150,.7)}${flower(380,300,1.5)}${flower(1260,420,1.2)}${flower(900,1000,1)}${flower(1480,160,1.3)}`;
  return `<svg class="botan" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
    <g fill="#ffffff" stroke="#ffffff" opacity=".26" transform="translate(-1.5 -1.5)">${art}</g>
    <g fill="#6f7a88" stroke="#6f7a88" opacity=".06" transform="translate(1.5 1.5)">${art}</g></svg>`;
}

/* ---------- router ---------- */
function resolve(k){
  const R={home,film,photography,'photo-services':photoServices,design,art,about,experience,education,resume,contact};
  if(R[k]) return R[k]();
  const f=FILMS.find(x=>x.id===k); if(f) return filmDetail(f);
  const d=DESIGN.find(x=>x.id===k); if(d) return designCase(d);
  let m=k.match(/^photo-session-(.+)$/);
  if(m){const c=CATS.find(x=>x.id===m[1]); if(c) return photoSession(c);}
  const c=CATS.find(x=>'photo-'+x.id===k); if(c) return photoCat(c);
  return null;
}
const main=$('#main');
let timer=null, io=null;
function buildNav(cur){
  $('#nav').innerHTML=NAV.map(([k,t])=>`<a href="#${k}"${k===cur?' aria-current="page"':''}>${t}</a>`).join('');
  $('#menuList').innerHTML=NAV.map(([k,t])=>`<a href="#${k}"${k===cur?' aria-current="page"':''}>${t}</a>`).join('');
  $('#menuSub').innerHTML=SUBLINKS.map(([k,t])=>`<a href="#${k}">${t}</a>`).join('')+`<a href="mailto:${EMAIL}">${EMAIL}</a>`;
}
function fit(){
  $$('.wm').forEach(wm=>{
    const lines=$$('.wm-l',wm); if(!lines.length) return;
    wm.style.fontSize='100px';
    const w=Math.max(...lines.map(l=>l.getBoundingClientRect().width)); const cw=wm.clientWidth;
    if(!w||!cw) return;
    const max=+(wm.dataset.max||200);
    wm.style.fontSize=Math.min(max,(100*cw/w)*0.985)+'px';
  });
}
function setupReveal(){
  if(io){io.disconnect();io=null}
  if(reduce||!('IntersectionObserver' in window)) return;
  const vh=innerHeight;
  const pending=$$('#main .rv').filter(e=>e.getBoundingClientRect().top>vh*0.98);
  pending.forEach(e=>e.classList.add('pre'));
  io=new IntersectionObserver(ents=>{let n=0;ents.forEach(en=>{if(en.isIntersecting){const t=en.target;t.style.transitionDelay=(Math.min(n++,4)*90)+'ms';t.classList.remove('pre');io.unobserve(t);setTimeout(()=>{t.style.transitionDelay=''},1500);}})},{rootMargin:'0px 0px 8% 0px',threshold:0.01});
  pending.forEach(e=>io.observe(e));
}
function closeMenu(){const m=$('#menu');m.classList.remove('open');m.setAttribute('aria-hidden','true');$('#menuBtn').setAttribute('aria-expanded','false');document.body.style.overflow=''}
function go(first){
  const k=((location.hash||'#home').slice(1))||'home';
  const r=resolve(k)||resolve('home');
  const apply=()=>{
    main.innerHTML=r.html+footer();
    document.body.dataset.page=r.theme;
    buildNav(r.nav);
    document.title=r.title==='Home'?'Katherine Elizabeth':r.title+' · Katherine Elizabeth';
    window.scrollTo(0,0);
    closeMenu();
    fit(); setupReveal();
    main.classList.remove('leaving');
    if(!first&&!reduce){main.classList.remove('entering');void main.offsetWidth;main.classList.add('entering')}
  };
  clearTimeout(timer);
  if(first||reduce){apply()}else{main.classList.add('leaving');timer=setTimeout(apply,170)}
}
addEventListener('hashchange',()=>go(false));
addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

/* ---------- toast + copy ---------- */
let tt=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function copyText(text,anchorEl){
  const fallback=()=>{const el=anchorEl||$('#mailText');if(el){const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Press Ctrl or ⌘ + C to copy')};
  try{navigator.clipboard.writeText(text).then(()=>toast('Copied'),fallback)}catch(e){fallback()}
}

/* ---------- lightbox ---------- */
const lb={el:$('#lb'),g:null,i:0,v:0,last:null};
function ratioNum(r){const [a,b]=r.split('/').map(Number);return b?a/b:1}
function lbRender(){
  const it=lb.g[lb.i];
  const view=it.info?it.info.views[lb.v]:null;
  const o={...it,label:view?`${it.label} · ${view}`:it.label};
  $('#lbStage').innerHTML=ph(o,'lb-fig');
  const fig=$('#lbStage .frame'); fig.style.setProperty('--rn',ratioNum(it.r||'4/5'));
  $('#lbCount').textContent=`${String(lb.i+1).padStart(2,'0')} / ${String(lb.g.length).padStart(2,'0')}`;
  $('#lbCap').textContent=it.cap||'';
  const info=$('#lbInfo');
  if(it.info){
    lb.el.classList.add('info');info.hidden=false;
    info.innerHTML=`<h2>${esc(it.info.title)}</h2><dl><dt>Year</dt><dd class="todo">${esc(it.info.year)}</dd><dt>Medium</dt><dd>${esc(it.info.medium)}</dd><dt>Size</dt><dd class="todo">${esc(it.info.dims)}</dd></dl><p class="todo">${esc(it.info.desc)}</p><div><p class="eyebrow" style="color:#A7A39C;margin-bottom:8px">Additional views</p><div class="lb-views">${it.info.views.map((v,k)=>`<button data-lb-view="${k}" aria-pressed="${k===lb.v}">${esc(v)}</button>`).join('')}</div></div>`;
  }else{lb.el.classList.remove('info');info.hidden=true;info.innerHTML=''}
  const multi=lb.g.length>1;$('#lbPrev').hidden=!multi;$('#lbNext').hidden=!multi;
}
function lbOpen(g,i,trigger){
  lb.g=LB[g];lb.i=i;lb.v=0;lb.last=trigger;lbRender();
  lb.el.classList.add('open');lb.el.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';
  $('#lbClose').focus();
}
function lbClose(){lb.el.classList.remove('open');lb.el.setAttribute('aria-hidden','true');document.body.style.overflow='';if(lb.last&&document.contains(lb.last))lb.last.focus()}
function lbStep(d){lb.i=(lb.i+d+lb.g.length)%lb.g.length;lb.v=0;lbRender()}
$('#lbClose').addEventListener('click',lbClose);
$('#lbPrev').addEventListener('click',()=>lbStep(-1));
$('#lbNext').addEventListener('click',()=>lbStep(1));
let tx=null;
$('#lbStage').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
$('#lbStage').addEventListener('touchend',e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50&&lb.g.length>1)lbStep(dx<0?1:-1)});

/* ---------- menu ---------- */
function openMenu(){const m=$('#menu');m.classList.add('open');m.setAttribute('aria-hidden','false');$('#menuBtn').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';$('#menuClose').focus()}
$('#menuBtn').addEventListener('click',openMenu);
$('#menuClose').addEventListener('click',()=>{closeMenu();$('#menuBtn').focus()});
$('#menu').addEventListener('click',e=>{if(e.target.closest('a'))closeMenu()});
$('#skip').addEventListener('click',e=>{e.preventDefault();main.focus();main.scrollIntoView()});

/* ---------- delegated interactions ---------- */
function setVar(k){
  const n=4;k=(k+n)%n;const v='ABCD'[k];
  const st=$('#varStage');if(!st)return;
  st.dataset.i=k;$('#varLabel').textContent=`Variation ${v} · placeholder`;
  st.style.background=['#DAD3C8','#CFC7BB','#E4DED4','#C4BCB0'][k];
  $$('[data-var-i]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.varI===k)));
}
function setSide(s){
  const fl=$('#flipper');if(!fl)return;
  const folded=$('#folded'),flip=$('.flip-in',fl);
  if(s==='folded'){flip.hidden=true;folded.hidden=false}
  else{flip.hidden=false;folded.hidden=true;fl.dataset.side=s}
  $$('[data-side]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.side===s))});
}
document.addEventListener('click',e=>{
  const t=e.target;
  let el;
  if((el=t.closest('[data-lb]'))){const [g,i]=el.dataset.lb.split(':');lbOpen(g,+i,el);return}
  if((el=t.closest('[data-lb-view]'))){lb.v=+el.dataset.lbView;lbRender();return}
  if((el=t.closest('[data-copy]'))){copyText(el.dataset.copy,el.closest('p,div')&&$('#mailText'));return}
  if((el=t.closest('[data-scroll]'))){const x=document.getElementById(el.dataset.scroll);if(x)x.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});return}
  if((el=t.closest('[data-film-filter]'))){S.film.f=el.dataset.filmFilter;S.film.sel=0;$$('[data-film-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));$('#film-dyn').innerHTML=filmDyn();return}
  if((el=t.closest('[data-film-sel]'))){S.film.sel=+el.dataset.filmSel;$('#film-dyn').innerHTML=filmDyn();return}
  if((el=t.closest('[data-embed]'))){const id=el.dataset.embed;el.outerHTML=`<span class="frame vid" style="--r:16/9"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="Film player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></span>`;return}
  if((el=t.closest('[data-exp-filter]'))){S.exp=el.dataset.expFilter;$$('[data-exp-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));$$('.ent').forEach(a=>{a.hidden=!(S.exp==='all'||a.dataset.cat===S.exp)});return}
  if((el=t.closest('[data-exp-toggle]'))){const a=el.closest('.ent');const open=!a.classList.contains('open');a.classList.toggle('open',open);el.setAttribute('aria-expanded',String(open));$('.ent-p',a).inert=!open;return}
  if((el=t.closest('[data-resume-dl]'))){toast('The résumé PDF has not been added yet. Once it is, this button downloads it.');return}
  if((el=t.closest('[data-flip]'))){const fl=$('#flipper');setSide(fl.dataset.side==='front'?'back':'front');return}
  if((el=t.closest('button[data-side]'))){setSide(el.dataset.side);return}
  if((el=t.closest('[data-var]'))){const cur=+($('#varStage').dataset.i||0);setVar(cur+ +el.dataset.var);return}
  if((el=t.closest('[data-var-i]'))){setVar(+el.dataset.varI);return}
});
document.addEventListener('keydown',e=>{
  if(lb.el.classList.contains('open')){
    if(e.key==='Escape'){lbClose();return}
    if(e.key==='ArrowLeft'&&lb.g.length>1){lbStep(-1);return}
    if(e.key==='ArrowRight'&&lb.g.length>1){lbStep(1);return}
    if(e.key==='Tab'){const f=$$('button',lb.el).filter(b=>!b.hidden&&b.offsetParent!==null);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
    return;
  }
  if(e.key==='Escape'&&$('#menu').classList.contains('open')){closeMenu();$('#menuBtn').focus();return}
  const fl=e.target.closest&&e.target.closest('[data-flip]');
  if(fl&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setSide($('#flipper').dataset.side==='front'?'back':'front')}
  if(e.target.closest&&e.target.closest('.var-row,.var-stage')){if(e.key==='ArrowLeft')setVar(+($('#varStage').dataset.i||0)-1);if(e.key==='ArrowRight')setVar(+($('#varStage').dataset.i||0)+1)}
});

/* video thumbnails: try the next source, then fall back to the poster underneath */
function ytNext(img){
  const rest=(img.dataset.srcs||'').split('|').filter(Boolean);
  img.hidden=true;
  if(rest.length){img.src=rest.shift();img.dataset.srcs=rest.join('|')}
}
document.addEventListener('error',e=>{if(e.target.classList&&e.target.classList.contains('yt'))ytNext(e.target)},true);
document.addEventListener('load',e=>{const i=e.target;if(!i.classList||!i.classList.contains('yt'))return;if(i.naturalWidth>120)i.hidden=false;else ytNext(i)},true);

go(true);
})();
</script>
